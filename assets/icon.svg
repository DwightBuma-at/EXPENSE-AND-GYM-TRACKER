<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#0051A8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#248A3D" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272A" stroke-width="8" />

  <!-- Dumbbell Icon (Blue) -->
  <g transform="translate(90, 150) rotate(-25 100 100)" fill="none" stroke="url(#blueGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 90h120M20 60v60M60 70v40M140 70v40M180 60v60" />
  </g>

  <!-- Wallet / Card Icon (Green) -->
  <g transform="translate(230, 240)" fill="none" stroke="url(#greenGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="40" width="180" height="120" rx="20" />
    <path d="M20 80h180" />
    <circle cx="150" cy="115" r="10" fill="#34C759" stroke="none" />
  </g>
</svg>
