<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym tracker & Expense tracker</title>

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />

  <!-- Local Offline Tailwind & Lucide with CDN Fallbacks -->
  <script src="assets/js/tailwind.min.js"></script>
  <script>
    if (typeof tailwind === 'undefined') {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', -apple-system, BlinkMacSystemFont, 'sans-serif'],
            display: ['"Plus Jakarta Sans"', -apple-system, BlinkMacSystemFont, 'sans-serif'],
          },
          colors: {
            border: "hsl(240 3.7% 15.9%)",
            background: "hsl(240 10% 3.9%)",
            card: "hsl(240 10% 4.9%)",
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="assets/js/lucide.min.js"></script>
  <script>
    if (typeof lucide === 'undefined') {
      document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');
    }
  </script>

  <style>
    .card-startup {
      background: radial-gradient(120% 120% at 50% 0%, rgba(255, 255, 255, 0.035) 0%, rgba(255, 255, 255, 0.008) 100%), hsl(240 10% 4.9%);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-startup:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }
    .card-static {
      background: radial-gradient(120% 120% at 50% 0%, rgba(255, 255, 255, 0.035) 0%, rgba(255, 255, 255, 0.008) 100%), hsl(240 10% 4.9%);
      transform: none !important;
      transition: none !important;
    }
  </style>
</head>

<body class="bg-background text-zinc-100 min-h-screen flex flex-col items-center justify-start sm:justify-center p-5 pt-8 sm:p-6 antialiased selection:bg-zinc-800 selection:text-white">

  <!-- Subtle Ambient Glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-amber-500/10 rounded-full blur-[130px]"></div>
    <div class="absolute top-1/2 left-1/3 -translate-y-1/2 -translate-x-1/2 w-96 h-96 bg-cyan-500/10 rounded-full blur-[120px]"></div>
    <div class="absolute top-1/2 right-1/3 -translate-y-1/2 translate-x-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-[120px]"></div>
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808008_1px,transparent_1px),linear-gradient(to_bottom,#80808008_1px,transparent_1px)] bg-[size:24px_24px]"></div>
  </div>

  <!-- Main Container -->
  <div class="w-full max-w-2xl flex flex-col gap-5">

    <!-- Card: Payroll Countdown (Static - Does Not Move) -->
    <div class="card-static rounded-2xl border border-border py-4 sm:py-5 px-6 flex flex-col items-center justify-center text-center shadow-md w-full select-none cursor-default">
      <h2 id="payday-title" class="font-display font-bold text-xl sm:text-2xl text-zinc-100">
        <span id="payday-days" class="text-amber-400 font-black">--</span> days before payday
      </h2>
      <p id="payday-subtitle" class="text-sm text-zinc-400 mt-1">Next payout: Calculating...</p>
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

      <!-- Card 1: Gym tracker -->
      <a href="gym.html" class="card-startup group relative rounded-2xl border border-border p-8 flex flex-col items-center justify-center text-center cursor-pointer hover:border-cyan-500/40 block no-underline">
        <div class="h-16 w-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 mb-5 shadow-[0_0_25px_-5px_rgba(6,182,212,0.3)] group-hover:scale-105 transition-transform">
          <i data-lucide="dumbbell" class="w-8 h-8"></i>
        </div>
        <h2 class="font-display font-bold text-lg text-zinc-100 group-hover:text-cyan-400 transition-colors">
          Gym tracker
        </h2>
      </a>

      <!-- Card 2: Expense tracker -->
      <a href="expense.html" class="card-startup group relative rounded-2xl border border-border p-8 flex flex-col items-center justify-center text-center cursor-pointer hover:border-emerald-500/40 block no-underline">
        <div class="h-16 w-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 mb-5 shadow-[0_0_25px_-5px_rgba(16,185,129,0.3)] group-hover:scale-105 transition-transform">
          <i data-lucide="wallet" class="w-8 h-8"></i>
        </div>
        <h2 class="font-display font-bold text-lg text-zinc-100 group-hover:text-emerald-400 transition-colors">
          Expense tracker
        </h2>
      </a>

    </div>

  </div>

  <script>
    function updatePaydayCard() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const date = now.getDate();

      const today = new Date(year, month, date, 0, 0, 0, 0);

      // Paydays are the 10th and 25th
      let targetPayday;
      let isPayday = false;

      if (date === 10 || date === 25) {
        isPayday = true;
        targetPayday = today;
      } else if (date < 10) {
        targetPayday = new Date(year, month, 10, 0, 0, 0, 0);
      } else if (date < 25) {
        targetPayday = new Date(year, month, 25, 0, 0, 0, 0);
      } else {
        targetPayday = new Date(year, month + 1, 10, 0, 0, 0, 0);
      }

      const msPerDay = 1000 * 60 * 60 * 24;
      const daysUntil = Math.round((targetPayday.getTime() - today.getTime()) / msPerDay);

      const titleEl = document.getElementById('payday-title');
      const subtitleEl = document.getElementById('payday-subtitle');

      const formatFull = (d) => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

      if (isPayday) {
        titleEl.innerHTML = `<span class="text-emerald-400 font-black">Today is Payday! 🎉</span>`;
        subtitleEl.textContent = `10th & 25th Payroll • Enjoy your pay!`;
      } else if (daysUntil === 1) {
        titleEl.innerHTML = `<span class="text-amber-400 font-black">1</span> day before payday`;
        subtitleEl.textContent = `Next payout: Tomorrow (${formatFull(targetPayday)})`;
      } else {
        titleEl.innerHTML = `<span class="text-amber-400 font-black">${daysUntil}</span> days before payday`;
        subtitleEl.textContent = `Next payout: ${formatFull(targetPayday)}`;
      }

      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      updatePaydayCard();
      // Re-calculate every 60 seconds so it's always real-time
      setInterval(updatePaydayCard, 60000);

      // Instantly refresh when returning to tab or unlocking phone
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) updatePaydayCard();
      });
      window.addEventListener('focus', updatePaydayCard);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();
        }).catch(() => {});

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>
</body>
</html>
