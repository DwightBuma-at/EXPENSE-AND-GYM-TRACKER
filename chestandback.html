    /* Outlined Inset Card */

      border-radius: 22px;
      border: 1.5px solid #D1D1D6;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    /* Primary iOS Button */
    .ios-btn-primary {
      background-color: #007AFF;
      color: #FFFFFF;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);

    @keyframes iosSpring {
      from {
        opacity: 0;

      to {
        opacity: 1;
        transform: scale(1) translateY(0);

</head>

  <!-- Modal 1: Log Exercise Session (Reps, Weight & KG/LBS Toggle) -->
  <div id="logModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs hidden flex items-start pt-16 sm:pt-20 justify-center p-4">
    <div class="ios-modal-anim w-full max-w-sm ios-outlined-card p-6 space-y-4 shadow-xl">
      <div class="flex items-start justify-between border-b border-[#E5E5EA] pb-3">
        <div>
          <h3 class="font-bold text-lg text-gray-900 leading-tight" id="modal-exercise-title">
            Log Workout
          </h3>
          <p class="text-xs text-gray-500 pt-0.5">2 Sets Routine • Enter details</p>
        </div>
        <button onclick="closeLogModal()" class="text-gray-400 hover:text-gray-700 p-1 rounded-full hover:bg-gray-100 transition-colors cursor-pointer">

      <form id="logForm" onsubmit="handleSaveLog(event)" class="space-y-4">

          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">Reps per set</label>
          <input 
            type="number" 
            id="log-reps" 
            required 
            min="1" 
            value="12" 
            class="w-full px-3.5 py-2.5 rounded-xl border border-[#C6C6C8] bg-white text-gray-900 font-semibold text-base focus:outline-none focus:border-[#007AFF] focus:ring-2 focus:ring-[#007AFF]/20 transition-all"
          />
        </div>

        <!-- Weight with KG / LBS Toggle -->
        <div>

            <label class="block text-xs font-bold uppercase tracking-wider text-gray-500">Weight</label>
            <!-- iOS Segmented Toggle -->
            <div class="flex p-0.5 rounded-lg bg-gray-200 text-xs font-semibold select-none">
              <button 
                type="button" 
                id="unit-kg-btn" 
                onclick="setUnit('kg')" 
                class="px-2.5 py-0.5 rounded-md bg-white text-gray-900 shadow-xs transition-all cursor-pointer"

                KG

              <button 
                type="button" 
                id="unit-lbs-btn" 
                onclick="setUnit('lbs')"

              >
                LBS

          </div>

          <div class="relative">
            <input 
              type="number" 
              step="any"
              id="log-weight" 
              required 
              placeholder="e.g. 24" 
              class="w-full px-3.5 py-2.5 rounded-xl border border-[#C6C6C8] bg-white text-gray-900 font-semibold text-base focus:outline-none focus:border-[#007AFF] focus:ring-2 focus:ring-[#007AFF]/20 transition-all pr-12"

  <!-- Modal 2: Floating Workout History Modal -->
  <div id="historyModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs hidden flex items-start pt-16 sm:pt-20 justify-center p-4">
    <div class="ios-modal-anim w-full max-w-sm ios-outlined-card p-5 space-y-3.5 shadow-xl">
      
      <!-- View 1: Dates List -->
      <div id="history-dates-view">
        <div class="flex items-start justify-between border-b border-[#E5E5EA] pb-2.5 mb-3">
          <div>
            <h3 class="font-bold text-lg text-gray-900 leading-tight">
              Workout Logs
            </h3>
            <p class="text-xs text-gray-500 pt-0.5">Select a date to view workouts</p>
          </div>
          <button onclick="closeHistoryModal()" class="text-gray-400 hover:text-gray-700 p-1 rounded-full hover:bg-gray-100 transition-colors cursor-pointer">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <div id="historyDatesList" class="space-y-2 max-h-80 overflow-y-auto pr-0.5">
          <!-- Injected via JavaScript -->
        </div>
      </div>

      <!-- View 2: All Workouts on Selected Date -->
      <div id="history-detail-view" class="hidden">
        <div class="flex items-center justify-between border-b border-[#E5E5EA] pb-2.5 mb-3">
          <button onclick="backToDatesView()" class="inline-flex items-center gap-1 text-[#007AFF] text-sm font-semibold hover:opacity-80 active:opacity-40 transition-opacity cursor-pointer">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
            <span>Dates</span>
          </button>
          <span class="font-bold text-base text-gray-900" id="detail-date-title">
            Date
          </span>
          <button onclick="closeHistoryModal()" class="text-gray-400 hover:text-gray-700 p-1 rounded-full hover:bg-gray-100 transition-colors cursor-pointer">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <div id="historyDetailList" class="space-y-2.5 max-h-80 overflow-y-auto pr-0.5">
          <!-- Injected via JavaScript -->
        </div>
      </div>

    </div>
  </div>

  <script>
    const STORAGE_KEY = 'gym_daily_logs_chestandback';
    let currentExercise = '';
    let currentUnit = 'kg';
    let selectedDate = '';

    function getLogs() {
      let logs = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!logs) {
        logs = {};
        // Migrate old logs if any exist
        const old = JSON.parse(localStorage.getItem('gym_workout_logs_chestandback'));
        if (old) {
          for (const exName in old) {
            old[exName].forEach(item => {
              const parts = (item.text || '').split('|').map(s => s.trim());
              const d = parts[0] || '9/10/26';
              const r = (parts[1] || '12 reps').replace(/reps?/i, '').trim() || '12';
              const wRaw = parts[2] || '50 kg';
              const wVal = wRaw.split(' ')[0] || '50';
              const uVal = (wRaw.split(' ')[1] || 'kg').toLowerCase();
              if (!logs[d]) logs[d] = [];
              logs[d].push({
                id: item.id || Date.now().toString(),
                exercise: exName,
                reps: r,
                weight: wVal,
                unit: uVal,
                timestamp: item.timestamp || Date.now()
              });
            });
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
        }
      }
      return logs;
    }

    function saveLogs(logs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
    }

    function setUnit(unit) {
      currentUnit = unit;
      const kgBtn = document.getElementById('unit-kg-btn');
      const lbsBtn = document.getElementById('unit-lbs-btn');
      const unitLabel = document.getElementById('weight-unit-label');

      if (unit === 'kg') {
        kgBtn.className = 'px-2.5 py-0.5 rounded-md bg-white text-gray-900 shadow-xs transition-all cursor-pointer font-bold';
        lbsBtn.className = 'px-2.5 py-0.5 rounded-md text-gray-500 hover:text-gray-900 transition-all cursor-pointer font-semibold';
        unitLabel.textContent = 'KG';
      } else {
        lbsBtn.className = 'px-2.5 py-0.5 rounded-md bg-white text-gray-900 shadow-xs transition-all cursor-pointer font-bold';
        kgBtn.className = 'px-2.5 py-0.5 rounded-md text-gray-500 hover:text-gray-900 transition-all cursor-pointer font-semibold';
        unitLabel.textContent = 'LBS';
      }
    }

    function openLogModal(exerciseName) {
      currentExercise = exerciseName;
      document.getElementById('modal-exercise-title').textContent = exerciseName;
      document.getElementById('log-reps').value = '12';
      document.getElementById('log-weight').value = '';
      const saveBtn = document.getElementById('save-log-btn');
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = 'Save Log';
      }
      setUnit('kg');
      document.getElementById('logModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('log-weight').focus(), 50);
    }

    function closeLogModal() {
      document.getElementById('logModal').classList.add('hidden');
      document.getElementById('logForm').reset();
      const saveBtn = document.getElementById('save-log-btn');
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = 'Save Log';
      }
    }

    function handleSaveLog(e) {
      e.preventDefault();
      const reps = document.getElementById('log-reps').value.trim() || '12';
      const weight = document.getElementById('log-weight').value.trim();
      if (!weight) return;

      const saveBtn = document.getElementById('save-log-btn');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = `
          <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>Saving...</span>
        `;
      }

      setTimeout(() => {
        const now = new Date();
        const year = now.getFullYear().toString().slice(-2);
        const dateFormatted = `${now.getMonth() + 1}/${now.getDate()}/${year}`;

        const logs = getLogs();
        if (!logs[dateFormatted]) {
          logs[dateFormatted] = [];
        }

        logs[dateFormatted].push({
          id: Date.now().toString(),
          exercise: currentExercise,
          reps: reps,
          weight: weight,
          unit: currentUnit,
          timestamp: Date.now()
        });

        saveLogs(logs);

        if (saveBtn) {
          saveBtn.innerHTML = `
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
            </svg>
            <span>Saved!</span>
          `;
        }

        setTimeout(() => {
          closeLogModal();
          if (!document.getElementById('historyModal').classList.contains('hidden')) {
            renderDatesList();
            if (selectedDate === dateFormatted) {
              showDateDetails(dateFormatted);
            }
          }
        }, 350);
      }, 550);
    }

    function openHistoryModal(exerciseName, event) {
      if (event) event.stopPropagation();
      backToDatesView();
      renderDatesList();
      document.getElementById('historyModal').classList.remove('hidden');
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').classList.add('hidden');
    }

    function backToDatesView() {
      document.getElementById('history-dates-view').classList.remove('hidden');
      document.getElementById('history-detail-view').classList.add('hidden');
      renderDatesList();
    }

    function showDateDetails(dateKey) {
      selectedDate = dateKey;
      document.getElementById('detail-date-title').textContent = dateKey;
      document.getElementById('history-dates-view').classList.add('hidden');
      document.getElementById('history-detail-view').classList.remove('hidden');
      renderDateDetails(dateKey);
    }

    function deleteWorkoutEntry(dateKey, id) {
      const logs = getLogs();
      if (logs[dateKey]) {
        logs[dateKey] = logs[dateKey].filter(item => item.id !== id);
        if (logs[dateKey].length === 0) {
          delete logs[dateKey];
          saveLogs(logs);
          backToDatesView();
          return;
        }
        saveLogs(logs);
        renderDateDetails(dateKey);
      }
    }

    function renderDatesList() {
      const container = document.getElementById('historyDatesList');
      const logs = getLogs();
      const dates = Object.keys(logs);

      if (dates.length === 0) {
        container.innerHTML = `
          <div class="py-6 px-4 text-center text-gray-400 text-xs font-medium border border-dashed border-gray-200 rounded-xl">
            No workout logs recorded yet.<br>Tap an exercise to record your workout.
          </div>
        `;
        return;
      }

      container.innerHTML = dates.map(dateKey => {
        const uniqueExercises = new Set(logs[dateKey].map(item => item.exercise)).size;
        return `
          <div onclick="showDateDetails('${dateKey}')" class="py-3 px-4 rounded-xl bg-gray-50 border border-gray-200/80 flex items-center justify-between group cursor-pointer hover:bg-gray-100/90 active:bg-gray-200/70 transition-all select-none">
            <span class="font-bold text-sm text-gray-900 group-hover:text-[#007AFF] transition-colors">
              ${dateKey}
            </span>
            <div class="flex items-center gap-2">
              <span class="text-xs font-medium text-gray-400">${uniqueExercises} ${uniqueExercises === 1 ? 'exercise' : 'exercises'}</span>
              <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400 group-hover:text-[#007AFF] group-hover:translate-x-0.5 transition-all"></i>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function renderDateDetails(dateKey) {
      const container = document.getElementById('historyDetailList');
      const logs = getLogs();
      const list = (logs[dateKey] || []).slice().sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      if (list.length === 0) {
        container.innerHTML = `
          <div class="py-6 px-4 text-center text-gray-400 text-xs font-medium border border-dashed border-gray-200 rounded-xl">
            No workouts for this date.
          </div>
        `;
        return;
      }

      // Group sets under their respective exercise
      const groups = [];
      const groupMap = new Map();

      list.forEach(item => {
        if (!groupMap.has(item.exercise)) {
          const group = {
            exercise: item.exercise,
            sets: []
          };
          groupMap.set(item.exercise, group);
          groups.push(group);
        }
        groupMap.get(item.exercise).sets.push(item);
      });

      container.innerHTML = groups.map(group => `
        <div class="p-3.5 rounded-xl bg-gray-50 border border-gray-200/80">
          <h4 class="font-bold text-[15px] text-gray-900 leading-snug mb-1">
            ${group.exercise}
          </h4>
          <div class="space-y-1">
            ${group.sets.map(item => `
              <div class="flex items-center justify-between text-xs sm:text-sm font-semibold text-gray-600">
                <span>- ${item.reps} reps | ${item.weight}${item.unit}</span>
                <button onclick="deleteWorkoutEntry('${dateKey}', '${item.id}')" class="text-gray-300 hover:text-red-500 p-0.5 rounded transition-colors cursor-pointer" title="Delete set">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    window.addEventListener('click', (e) => {
      const logModal = document.getElementById('logModal');
      const historyModal = document.getElementById('historyModal');
      if (e.target === logModal) closeLogModal();
      if (e.target === historyModal) closeHistoryModal();
    });

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
